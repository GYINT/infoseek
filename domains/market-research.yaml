# 市场研究领域 Profile (v1.8.0)

> 专注**市场规模、用户画像、竞争格局、行业趋势**的市场研究。

## 适用场景
- 新行业进入可行性分析
- 目标客群画像与需求挖掘
- 竞争对手分析（市场份额、产品矩阵）
- 行业趋势预测与策略制定

## 信任源白名单（Tier 1）
| 类型 | 来源 | 权重 |
|:-----|:-----|:-----|
| 报告 | 36氪/艾瑞/易观/QuestMobile/Statista | +20 |
| 数据 | 国家统计局/Statista/Wind/Bloomberg | +25 |
| 调研 | 麦肯锡/BCG/贝恩/Deloitte | +15 |
| 投行 | 中金/中信证券/Goldman Sachs/Morgan Stanley | +15 |
| 媒体 | 第一财经/财新/虎嗅/钛媒体 | +10 |

## 关键词模板
```yaml
template: "{行业} 市场规模 OR 用户画像 OR 竞争格局 OR 趋势"
examples:
  - "中国 SaaS 市场规模 2026"
  - "新能源汽车 用户画像 偏好"
  - "AI Agent 行业 竞争格局 头部"
```

## 评分权重微调
```yaml
Anchor_Score:
  interaction: 0.20
  topic_match: 0.35      # 默认 0.30，市场研究主题匹配更重要
  credibility: 0.30      # 默认 0.40
  llm_readability: 0.10
```

## 输出格式

```markdown
## 市场研究报告

### 1. 市场总览
- 市场规模（金额/增长率/CAGR）
- 主要细分市场

### 2. 用户画像
- 核心人群人口学特征
- 需求痛点 TOP-5

### 3. 竞争格局
- TOP-5 玩家市占率
- 产品矩阵对比

### 4. 趋势预测（12/24/36个月）
- 趋势 1：驱动因素 + 影响程度
- 趋势 2：...

### 5. 战略建议
- 进入策略 / 差异化策略
```

## 关联 Skill
- 检测到"市场/行业/规模/份额" → 自动启用 market-research profile
- 与 finance-research profile 共享"竞争格局"分析
