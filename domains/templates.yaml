templates:
  competitor-intel: |-
    {# domains/templates/competitor-intel.md.j2 — 竞品情报领域模板（v3.1.0） #}
    # {{ subject }} — 竞品情报报告

    > **领域**：competitor-intel
    > **模板版本**：v3.1.0

    ## 1. 竞品概览

    {% for s in sources %}
    - **[{{ loop.index }}] {{ s.title | default("Untitled") }}**（评分 {{ s.score | default(0) }}）
      - 平台：{{ s.platform | default("-") }}
      - 链接：{{ s.url | default("-") }}
      {% if s.snippet %}
      - 摘要：{{ s.snippet | truncate(200) }}
      {% endif %}
    {% endfor %}

    ## 2. 功能矩阵对比

    | 功能 | 我方 | 竞品 |
    |:-----|:-----|:-----|
    {% for s in sources[:5] %}
    | 功能 {{ loop.index }} | - | [{{ s.title | truncate(30) }}]({{ s.url }}) |
    {% endfor %}

    ## 3. 用户舆情

    > 注：用户舆情由用户社区源（Hacker News / Reddit / 即刻 / 知乎）汇总。

    ## 4. SWOT 分析

    - **Strengths**: 优势
    - **Weaknesses**: 劣势
    - **Opportunities**: 机会
    - **Threats**: 威胁

    ## 5. 可借鉴行动点

