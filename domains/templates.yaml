templates:
  default: "{# domains/templates/default.md.j2 — 默认通用模板（v3.2.0，P0-OPEN-05 加跨源综合段/空源守卫） #}\n# {{ subject }} — 调研报告\n\n> **领域**：{{ domain | default(\"通用\") }}\n> **模板版本**：v3.2.0\n> **来源数**：{{ sources_count | default(sources | length) }}\n\n## 概述\n\n{% if sources | length == 0 %}\n> ⚠️ 本报告没有入围核心来源（详见文末/文首「无可用核心来源」过滤清单），以下章节暂无数据支撑。\n{% endif %}\n本报告基于 Infoseek 多源调研，覆盖 {{ sources_count | default(sources | length) }} 个核心来源。\n\n## 来源列表\n\n{% for s in sources %}\n- **[{{ loop.index }}] {{ s.title | default(\"Untitled\") }}**（评分 {{ s.score | default(0) }}）\n  - 平台：{{ s.platform | default(\"-\") }}\n  - 链接：{{ s.url | default(\"-\") }}\n  {% if s.snippet %}\n  - 摘要：{{ s.snippet | truncate(200) }}\n  {% endif %}\n  {% if s.text_excerpt %}\n  - 正文要点：{{ s.text_excerpt }}\n  {% endif %}\n{% endfor %}\n\n## 关键内容要点\n\n{% for s in sources %}\n{% if s.text_excerpt %}\n- **[{{ loop.index }}] {{ s.title | default(\"Untitled\") }}**：{{ s.text_excerpt }}\n{% endif %}\n{% endfor %}\n\n## 跨源综合\n\n{% set core = sources | selectattr('score', '>=', 70) | list %}\n{% if core | length >= 2 %}\n> 基于 {{ core | length }} 个高分核心源（评分 ≥ 70）交叉印证：\n\n{% for s in core %}\n- **[{{ loop.index }}] {{ s.title | default(\"Untitled\") }}**（{{ s.score }} 分 · {{ s.platform | default(\"-\") }}）：{{ s.text_excerpt | default(s.snippet | default(\"\")) | truncate(160) }}\n{% endfor %}\n\n**多源一致性**：以上核心源对主题形成多点支撑；若关键事实在源间存在分歧，应以高可信源（官方/一手）为准并复核。\n{% elif core | length == 1 %}\n> 仅 1 个高分核心源（评分 ≥ 70）：**{{ core[0].title | default(\"Untitled\") }}**（{{ core[0].platform | default(\"-\") }}）。结论为单源支撑，建议补充独立第二来源交叉验证。\n{% else %}\n> ⚠️ 本报告无评分 ≥ 70 的高分核心源，以下内容可信度有限，跨源综合无法成立；请优先补充官方/一手高可信来源。\n{% endif %}\n\n## 总结\n\n> 本报告由 Infoseek 生成。\n{% if is_default_template %}\n> ⚠️ 使用默认模板（领域未识别或指定模板不可用）\n{% endif %}\n{{ filter_block | default(\"\") }}"
