# 金融投资研究领域 Profile (v1.8.0)

> 专注**股票/基金/债券/期货/外汇**等金融资产的投资研究。

## 适用场景
- 个股深度研究（财报/估值/可比公司）
- 行业轮动与主题选股
- 量化策略回测与参数调优
- 宏观指标分析（CPI/PMI/GDP/社融/利率/汇率）

## 信任源白名单（Tier 1）
| 类型 | 来源 | 权重 |
|:-----|:-----|:-----|
| 监管 | 证监会/上交所/深交所/CFTC/SEC | +25 |
| 数据 | Wind/Bloomberg/同花顺/东方财富 | +25 |
| 研报 | 中金/中信/招商/海通/华泰 | +20 |
| 官方 | 公司公告/年报/季报 | +20 |
| 媒体 | 华尔街见闻/格隆汇/财联社 | +10 |

## 关键词模板
```yaml
template: "{标的} {财报 OR 估值 OR 行业 OR 策略}"
examples:
  - "宁德时代 估值 可比公司"
  - "螺纹钢 持仓 行情"
  - "量化策略 2026"
```

## 评分权重微调
```yaml
Anchor_Score:
  interaction: 0.15      # 金融互动数据噪声大
  topic_match: 0.30
  credibility: 0.45      # 金融数据真实性至关重要
  llm_readability: 0.10
```

## 输出格式

```markdown
## 投资研究报告

### 1. 标的基本面
- 主营业务 / 营收结构
- 最新财报关键数据

### 2. 估值与可比公司
- PE/PB/PS-TTM
- 可比公司列表与估值对比

### 3. 行业地位
- 市占率
- 护城河分析

### 4. 风险因素
- 监管风险 / 行业风险 / 公司风险

### 5. 策略建议
- 短线 / 中线 / 长线买点
- 止损位 / 目标位
```

## 关联 Skill
- 检测到"股票/基金/债券/期货/外汇" → 自动启用 finance-research profile
- 与 existing `tdx-finance-skill` 集成
- 与 existing `daily_stock_analysis` Skill 协同
