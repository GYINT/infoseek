# 政策法规研究领域 Profile (v1.8.0)

> 专注**国家政策、法规、监管动态、合规要求**的政策研究。

## 适用场景
- 行业政策梳理与影响评估
- 法规变更追踪与合规预警
- 监管动态分析
- 政策红利识别

## 信任源白名单（Tier 1）
| 类型 | 来源 | 权重 |
|:-----|:-----|:-----|
| 政府 | 国务院/各部委/地方政府 | +25 |
| 法规 | 国家法律法规数据库/北大法宝 | +25 |
| 监管 | 银保监会/证监会/工信部 | +20 |
| 媒体 | 人民日报/经济日报/学习时报 | +15 |
| 解读 | 中国法学会/律所/智库 | +10 |

## 关键词模板
```yaml
template: "{政策/法规/标准} {解读 OR 影响 OR 合规}"
examples:
  - "数据安全法 解读 影响"
  - "新能源汽车补贴政策 2026"
  - "ISO 9001 2015 换版 合规"
```

## 评分权重微调
```yaml
Anchor_Score:
  interaction: 0.10      # 政策互动量不反映质量
  topic_match: 0.30
  credibility: 0.50      # 政策一手源极度重要
  llm_readability: 0.10
```

## 输出格式

```markdown
## 政策法规研究报告

### 1. 政策核心内容
- 颁布机构、生效时间、覆盖范围
- 关键条款摘录

### 2. 对企业的直接影响
- 业务影响 / 财务影响 / 组织影响

### 3. 合规要点清单
- 必做项 / 加分项 / 红线项

### 4. 历史政策对比
- 历次政策演进
- 监管态度变化
```

## 关联 Skill
- 检测到"政策/法规/标准/合规/监管" → 自动启用 policy-research profile
- 与 tech-research profile 联动（标准类内容）
